<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Usublox 2.0 - Arcade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background-color: #0f1117;
      color: #f1f2f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Navigation Bar */
    nav {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e272e;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #2f3542;
    }
    .logo { color: #ff4757; font-weight: bold; font-size: 1.3rem; letter-spacing: 1px; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }

    /* Device Mode Switcher */
    .device-switcher {
      display: flex;
      background: #14171d;
      padding: 4px;
      border-radius: 8px;
      gap: 5px;
      margin-bottom: 12px;
    }
    .device-btn {
      background: transparent;
      border: none;
      color: #a4b0be;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .device-btn.active { background: #ff4757; color: white; font-weight: bold; }

    /* Layout Wrapper */
    #game-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }
    .mode-mobile #game-wrapper { max-width: 360px; }
    .mode-tablet #game-wrapper { max-width: 500px; }
    .mode-pc #game-wrapper { max-width: 650px; }

    .controls-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background-color: #2f3542;
      color: #ffffff;
      border: 2px solid #57606f;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover, button.active { background-color: #ff4757; border-color: #ff6b81; }

    /* Game Canvas */
    #canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 3px solid #2f3542;
      border-radius: 10px;
      background-color: #1e272e;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Touch Controls */
    #touch-controls {
      display: none;
      margin-top: 15px;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 5px;
      justify-content: center;
    }
    .touch-btn {
      background: #2f3542;
      color: white;
      border: 1px solid #57606f;
      font-size: 1.2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .touch-btn:active { background: #ff4757; }

    .info-panel {
      margin-top: 10px;
      background: #1e272e;
      padding: 10px 15px;
      border-radius: 8px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      border: 1px solid #2f3542;
      font-size: 0.9rem;
    }
    .admin-section {
      margin-top: 15px;
      width: 100%;
      background: #14171d;
      border: 1px dashed #ff4757;
      padding: 12px;
      border-radius: 8px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #2f3542;
      background: #0f1117;
      color: #fff;
      margin-bottom: 8px;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-card {
      background: #1e272e;
      border: 2px solid #ff4757;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 380px;
    }
    .tab-header { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; background: #0f1117; border: none; padding: 8px; color: #a4b0be; cursor: pointer; }
    .tab-btn.active { background: #ff4757; color: white; }
    .hidden { display: none !important; }
    .update-list { text-align: left; margin: 15px 0; line-height: 1.8; list-style: none; }
    .update-list li { color: #f1f2f6; font-size: 0.95rem; }
  </style>
</head>
<body class="mode-auto">

  <nav>
    <div class="logo">USUBLOX <span style="font-size:0.8rem; color:#2ed573;">v2.0</span></div>
    <div class="nav-actions">
      <button onclick="openUpdatesModal()" style="background:#ff9f43; border-color:#ffa801;">See Updates</button>
      <span id="user-display" style="font-size:0.85rem; color:#a4b0be;">Guest</span>
      <button id="auth-btn" onclick="openAuthModal()">Sign In</button>
    </div>
  </nav>

  <!-- Device Switcher -->
  <div class="device-switcher">
    <button class="device-btn active" onclick="setDeviceMode('auto', this)">Auto</button>
    <button class="device-btn" onclick="setDeviceMode('mobile', this)">📱 Mobile</button>
    <button class="device-btn" onclick="setDeviceMode('tablet', this)">📲 Tablet</button>
    <button class="device-btn" onclick="setDeviceMode('pc', this)">💻 PC</button>
  </div>

  <div id="game-wrapper">
    <div class="controls-bar">
      <button id="btn-box" class="active" onclick="switchGame('box')">Box Runner</button>
      <button id="btn-clicker" onclick="switchGame('clicker')">Target Clicker</button>
    </div>

    <div id="canvas-container">
      <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <!-- On-screen Touch Controls -->
    <div id="touch-controls">
      <div></div>
      <div class="touch-btn" id="t-up">▲</div>
      <div></div>
      <div class="touch-btn" id="t-left">◄</div>
      <div class="touch-btn" id="t-down">▼</div>
      <div class="touch-btn" id="t-right">►</div>
    </div>

    <div class="info-panel">
      <span><strong>Mode:</strong> <span id="mode-text">Box Runner</span></span>
      <span><strong>Score:</strong> <span id="score-text" style="color: #2ed573;">0</span></span>
    </div>

    <div class="admin-section">
      <h3 style="color:#ff6b81; font-size: 0.9rem; margin-bottom: 6px;">Admin Console</h3>
      <div style="display:flex; gap:6px;">
        <input type="text" id="admin-key" placeholder="Enter key (e.g. usuthebanna)" style="margin:0;">
        <button onclick="verifyAdmin()">Auth</button>
      </div>
      <div id="admin-output" style="font-size:0.8rem; margin-top:5px;"></div>
    </div>
  </div>

  <!-- Update 2.0 Modal -->
  <div id="updates-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 style="color: #ff4757; text-align: center;">Update 2.0 Notes</h2>
      <ul class="update-list">
        <li>- Login Password System Fixed</li>
        <li>- Added Games</li>
        <li>- Made mobile and tablet playable</li>
      </ul>
      <button style="width: 100%; background: #ff4757;" onclick="closeUpdatesModal()">Close</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="tab-header">
        <button id="tab-signin" class="tab-btn active" onclick="switchAuthTab('signin')">Sign In</button>
        <button id="tab-signup" class="tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <div id="form-signin">
        <input type="text" id="signin-user" placeholder="Username">
        <input type="password" id="signin-pass" placeholder="Password">
        <button style="width:100%" onclick="handleSignIn()">Login</button>
      </div>

      <div id="form-signup" class="hidden">
        <input type="text" id="signup-user" placeholder="Choose Username">
        <input type="password" id="signup-pass" placeholder="Choose Password">
        <button style="width:100%" onclick="handleSignUp()">Create Account</button>
      </div>

      <button style="width:100%; margin-top:8px; background:#0f1117; border:none;" onclick="closeAuthModal()">Cancel</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const modeText = document.getElementById('mode-text');
    const touchControls = document.getElementById('touch-controls');

    let currentGame = 'box';
    let score = 0;
    let currentUser = localStorage.getItem('usublox_user') || null;

    let player = { x: 285, y: 185, size: 30, speed: 5, color: '#00d2d3' };
    let coin = { x: 100, y: 100, size: 18, color: '#ffa502' };
    let enemy = { x: 400, y: 50, size: 24, speedX: 3, speedY: 3, color: '#ff4757' };
    let keys = {};

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
    if (isMobile) touchControls.style.display = 'grid';

    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    const bindTouch = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
      el.addEventListener('mousedown', () => keys[key] = true);
      el.addEventListener('mouseup', () => keys[key] = false);
    };
    bindTouch('t-up', 'w');
    bindTouch('t-down', 's');
    bindTouch('t-left', 'a');
    bindTouch('t-right', 'd');

    function setDeviceMode(mode, btn) {
      document.body.className = 'mode-' + mode;
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      touchControls.style.display = (mode === 'pc') ? 'none' : 'grid';
    }

    canvas.addEventListener('click', (e) => {
      if (currentGame !== 'clicker') return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
      const dist = Math.hypot(clickX - coin.x, clickY - coin.y);
      if (dist < coin.size + 15) {
        score += 5;
        scoreText.innerText = score;
        spawnCoin();
      }
    });

    function spawnCoin() {
      coin.x = Math.floor(Math.random() * (canvas.width - 40)) + 20;
      coin.y = Math.floor(Math.random() * (canvas.height - 40)) + 20;
    }

    function switchGame(mode) {
      currentGame = mode;
      score = 0;
      scoreText.innerText = score;
      document.getElementById('btn-box').classList.toggle('active', mode === 'box');
      document.getElementById('btn-clicker').classList.toggle('active', mode === 'clicker');
      modeText.innerText = mode === 'box' ? 'Box Runner' : 'Target Clicker';
      spawnCoin();
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentGame === 'box') {
        if (keys['w'] || keys['arrowup']) player.y = Math.max(0, player.y - player.speed);
        if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.size, player.y + player.speed);
        if (keys['a'] || keys['arrowleft']) player.x = Math.max(0, player.x - player.speed);
        if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.size, player.x + player.speed);

        enemy.x += enemy.speedX; enemy.y += enemy.speedY;
        if (enemy.x <= 0 || enemy.x + enemy.size >= canvas.width) enemy.speedX *= -1;
        if (enemy.y <= 0 || enemy.y + enemy.size >= canvas.height) enemy.speedY *= -1;

        if (player.x < coin.x + coin.size && player.x + player.size > coin.x &&
            player.y < coin.y + coin.size && player.y + player.size > coin.y) {
          score += 10;
          scoreText.innerText = score;
          spawnCoin();
        }

        if (player.x < enemy.x + enemy.size && player.x + player.size > enemy.x &&
            player.y < enemy.y + enemy.size && player.y + player.size > enemy.y) {
          score = 0; scoreText.innerText = score; player.x = 285; player.y = 185;
        }

        ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.size, player.size);
        ctx.fillStyle = enemy.color; ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
        ctx.fillStyle = coin.color; ctx.beginPath(); ctx.arc(coin.x + coin.size/2, coin.y + coin.size/2, coin.size/2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.size + 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffa502'; ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.size, 0, Math.PI * 2); ctx.fill();
      }

      requestAnimationFrame(update);
    }

    // Modal Control Functions
    function openUpdatesModal() { document.getElementById('updates-modal').classList.remove('hidden'); }
    function closeUpdatesModal() { document.getElementById('updates-modal').classList.add('hidden'); }
    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

    function switchAuthTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-signin').classList.toggle('hidden', tab !== 'signin');
      document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');
    }

    async function handleSignIn() {
      const username = document.getElementById('signin-user').value.trim();
      const password = document.getElementById('signin-pass').value;
      if (!username || !password) return alert('Enter username and password');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) return alert(data.error || 'Login failed');

        currentUser = data.username;
        localStorage.setItem('usublox_user', currentUser);
        updateUserUI();
        closeAuthModal();
      } catch (err) {
        alert('Server error while logging in.');
      }
    }

    async function handleSignUp() {
      const username = document.getElementById('signup-user').value.trim();
      const password = document.getElementById('signup-pass').value;
      if (!username || !password) return alert('Choose username and password');

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) return alert(data.error || 'Sign up failed');

        currentUser = data.username;
        localStorage.setItem('usublox_user', currentUser);
        updateUserUI();
        closeAuthModal();
      } catch (err) {
        alert('Server error while signing up.');
      }
    }

    function updateUserUI() {
      if (currentUser) {
        document.getElementById('user-display').innerText = currentUser;
        document.getElementById('auth-btn').innerText = 'Log Out';
        document.getElementById('auth-btn').onclick = () => {
          localStorage.removeItem('usublox_user');
          currentUser = null;
          updateUserUI();
        };
      } else {
        document.getElementById('user-display').innerText = 'Guest';
        document.getElementById('auth-btn').innerText = 'Sign In';
        document.getElementById('auth-btn').onclick = openAuthModal;
      }
    }

    function verifyAdmin() {
      const val = document.getElementById('admin-key').value.trim();
      const output = document.getElementById('admin-output');
      if (val.toLowerCase() === 'usuthebanna') {
        output.style.color = '#2ed573';
        output.innerText = '✓ Admin Access Granted: usuthebanna permissions active.';
      } else {
        output.style.color = '#ff4757';
        output.innerText = '✗ Invalid Admin Key or User.';
      }
    }

    updateUserUI();
    spawnCoin();
    update();
  </script>
</body>
</html>
